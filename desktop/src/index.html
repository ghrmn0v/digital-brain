<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' ws://127.0.0.1:8080 http://127.0.0.1:8080; style-src 'self' 'unsafe-inline'" />
  <title>Fly / Connectome</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: rgba(18, 24, 32, 0.82);
      --line: #24303c;
      --text: #d7e0e8;
      --muted: #7f8fa3;
      --accent: #4aa3ff;
      --ok: #2ecc71;
      --warn: #e67e22;
      --bad: #e74c3c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    canvas { display: block; }

    #hud {
      position: fixed; top: 14px; left: 16px; z-index: 10;
      font-size: 12px; color: var(--muted); background: var(--panel);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
      backdrop-filter: blur(6px);
    }
    #hud .row { display: flex; align-items: center; gap: 8px; }
    #state { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
    #ws-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }

    #panel {
      position: fixed; right: 16px; top: 14px; bottom: 14px; width: 300px; z-index: 10;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px; overflow-y: auto; backdrop-filter: blur(6px);
      font-size: 13px;
    }
    #panel h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    #panel label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px; }
    #panel select, #panel input[type="text"], #panel input[type="range"] { width: 100%; }
    #panel select, #panel input[type="text"] {
      background: #10161e; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 7px 9px; font-size: 13px;
    }
    #panel .row { display: flex; gap: 8px; margin-top: 8px; }
    button {
      flex: 1; background: #17202b; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 6px; font-size: 12px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #06121f; font-weight: 700; border: none; }
    #priority-value { float: right; color: var(--accent); font-weight: 700; }

    /* ── Normal bubble — warm paper / parchment feel ─────────────── */
    #speech-bubble {
      position: fixed; left: 0; top: 0; z-index: 20;
      display: none; max-width: 300px;

      /* parchment tones */
      background: #f5f0e8;
      color: #2c2016;

      /* left accent stripe like a sticky note crease */
      border: 1px solid #d9ccb4;
      border-left: 3px solid #b89a6a;
      border-radius: 3px 12px 12px 3px;

      padding: 10px 14px 10px 12px;
      font-size: 13px; line-height: 1.55;

      /* warm serif — Georgia is universally available */
      font-family: Georgia, "Times New Roman", serif;

      /* soft warm shadow, no harsh dark drop */
      box-shadow:
        0 2px 8px rgba(90,60,20,0.18),
        0 0 0 1px rgba(180,150,100,0.12);

      transform: translate(-50%, -100%);
      pointer-events: none;
    }
    /* caret — matches parchment background */
    #speech-bubble::after {
      content: ""; position: absolute; top: 100%; left: 50%;
      margin-left: -8px; border: 8px solid transparent;
      border-top-color: #f5f0e8;
    }
    /* tiny shadow under caret so it reads against the dark scene */
    #speech-bubble::before {
      content: ""; position: absolute; top: calc(100% + 1px); left: 50%;
      margin-left: -9px; border: 9px solid transparent;
      border-top-color: rgba(90,60,20,0.15);
      z-index: -1;
    }
    #speech-bubble .speaker {
      display: block; margin-bottom: 4px;
      font-size: 10px; font-family: -apple-system, "Segoe UI", sans-serif;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
      color: #8a6a40;   /* warm brown */
    }
    #speech-bubble .text { display: block; color: #2c2016; }
    #speech-bubble .meta { display: none; }   /* hidden in normal mode */

    /* ── Dev bubble (added when _devModeActive) ──────────────────── */
    #speech-bubble.dev {
      background: rgba(0, 8, 4, 0.92);
      color: #00ff88;
      border: 1px solid #00ff88;
      border-radius: 4px;
      font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
      font-size: 12px; line-height: 1.6;
      box-shadow: 0 0 12px rgba(0,255,136,0.3), 0 0 32px rgba(0,255,136,0.12);
      max-width: 360px;
      /* scanline overlay */
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,255,136,0.03) 2px,
        rgba(0,255,136,0.03) 4px
      );
    }
    #speech-bubble.dev::before {
      content: "// SIGNAL RECEIVED";
      display: block; font-size: 9px; letter-spacing: 0.15em;
      color: rgba(0,255,136,0.45); margin-bottom: 6px;
    }
    #speech-bubble.dev::after {
      border-top-color: #00ff88;
    }
    #speech-bubble.dev .speaker {
      color: #00ffcc; font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; font-weight: 400;
    }
    #speech-bubble.dev .text {
      color: #00ff88;
    }
    #speech-bubble.dev .meta {
      display: block; margin-top: 6px; padding-top: 6px;
      border-top: 1px solid rgba(0,255,136,0.25);
      color: rgba(0,255,136,0.55); font-size: 10px;
    }
    /* blinking cursor at end of dev bubble text */
    #speech-bubble.dev .text::after {
      content: "▋";
      animation: blink 1s step-end infinite;
      color: #00ff88; margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0; }
    }
    #panel .dev-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    #panel .dev-toggle input { width: auto; margin: 0; }
    #toast {
      position: fixed; left: 50%; bottom: 34px; z-index: 30;
      transform: translateX(-50%);
      background: #121820; color: var(--text);
      border: 1px solid var(--line); border-left: 3px solid var(--ok);
      border-radius: 10px; padding: 9px 14px; font-size: 13px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
      white-space: nowrap;
    }
    #toast.visible { opacity: 1; }
    #toast .t-k { color: var(--accent); font-weight: 700; }
    #toast .t-r { color: var(--ok); font-weight: 700; }
  </style>
</head>
<body>
  <div id="speech-bubble"><span class="speaker"></span><span class="text"></span><span class="meta"></span></div>
  <div id="toast"></div>

  <div id="hud">
    <div class="row">
      <span id="ws-dot"></span>
      <span id="state">IDLE</span>
    </div>
    <div id="hud-tag"></div>
  </div>

  <div id="panel">
    <h3>Fly control</h3>
    <label for="event-picker">Event</label>
    <select id="event-picker"></select>
    <label for="priority">Priority <span id="priority-value">0.5</span></label>
    <input type="range" id="priority" min="0" max="1" step="0.05" value="0.5" />
    <label for="topic">Context topic</label>
    <input type="text" id="topic" value="job" />
    <label for="msg">Message (thought bubble)</label>
    <input type="text" id="msg" placeholder="məs. İş təklifi gəldi: Senior Engineer" />
    <div class="row">
      <button class="primary" id="send">Send event</button>
      <button id="demo-cycle">Demo cycle</button>
    </div>

    <h3>Feedback</h3>
    <div class="row">
      <button data-feedback="looked">Looked</button>
      <button data-feedback="marked_useful">Useful</button>
    </div>
    <div class="row">
      <button data-feedback="dismissed">Dismiss</button>
      <button data-feedback="marked_unnecessary">Unneeded</button>
    </div>
    <div class="row">
      <button data-feedback="interacted">Interact</button>
      <button data-feedback="ignored">Ignored</button>
    </div>

    <h3>Developer Mode</h3>
    <label class="dev-toggle"><input type="checkbox" id="dev-mode" /> Receive Core Brain developer events</label>
    <label class="dev-toggle"><input type="checkbox" id="flight-mode" /> Fly uça bilər (off: oturur + eventə reaksiya)</label>
  </div>

  <script type="module" src="./renderer.js"></script>
</body>
</html>
