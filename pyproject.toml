[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-brain-contracts"
version = "0.1.0"
description = "Shared contracts for Digital Brain — Core Brain / Product / Connectome boundaries (Phase 0)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "websockets>=12",
]

[project.scripts]
digital-brain-export-schema = "contracts.api.schema:main"

[tool.setuptools.packages.find]
include = ["contracts*", "core*"]

[tool.setuptools.package-data]
"contracts.schemas" = ["*.json"]

[tool.pytest.ini_options]
# The Core Brain suite only. This repository also holds Fly, whose tests live in
# `connectome/tests/` and are stdlib unittest, not pytest; without this the root
# run collects them too and fails on their imports. Fly's suite is run from its
# own directory: `cd connectome && python -m unittest discover -s tests`.
testpaths = ["tests"]
