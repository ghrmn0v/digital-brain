[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-brain-contracts"
version = "0.1.0"
description = "Shared contracts for Digital Brain — Core Brain / Product / Connectome boundaries (Phase 0)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8"]

[tool.setuptools.packages.find]
include = ["contracts*"]