[project]
name = "fly-connectome"
version = "0.1.0"
description = "Real Drosophila connectome inspired behavior engine for the Fly subsystem"
requires-python = ">=3.11"

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["connectome"]

[tool.setuptools.package-data]
connectome = ["data/*.json"]